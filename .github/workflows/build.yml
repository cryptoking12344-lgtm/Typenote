name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch typewriter font (Special Elite, Apache 2.0)
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/special_elite.ttf \
            https://raw.githubusercontent.com/google/fonts/main/apache/specialelite/SpecialElite-Regular.ttf

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Typenote-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Typenote-apk
          path: Typenote-${{ github.run_number }}.apk

      - name: Publish release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Typenote build ${{ github.run_number }}
          files: Typenote-${{ github.run_number }}.apk
